name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to verify and publish"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tag, package version, and stable ancestry
        id: release
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package.json version v${PKG_VERSION}"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "Checked-out commit ${HEAD_COMMIT} does not equal tag ${TAG} commit ${TAG_COMMIT}"
            exit 1
          fi
          ORIGIN_MAIN="$(git rev-parse origin/main)"
          if [[ "${PKG_VERSION}" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
            if [ "${TAG_COMMIT}" != "${ORIGIN_MAIN}" ]; then
              echo "Stable tag ${TAG} commit ${TAG_COMMIT} does not equal origin/main ${ORIGIN_MAIN}"
              exit 1
            fi
          fi
          # All three outputs are written here, in the step that computes them. PRERELEASE and
          # TAG are shell variables local to this step: a later `run:` is a separate process and
          # would read them as empty. They must not be moved out of this block.
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Assert the publish routing output is decidable
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # publish-prerelease and publish-stable are gated on `prerelease` being exactly
          # 'true' or 'false'. Anything else matches neither, so BOTH jobs skip, and the run
          # still reports success because a skipped job is not a failed one. Fail loudly here
          # instead of shipping nothing quietly.
          if [ "${PRERELEASE}" != "true" ] && [ "${PRERELEASE}" != "false" ]; then
            echo "::error::verify.outputs.prerelease is '${PRERELEASE}', expected 'true' or 'false'. Both publish jobs would skip and this run would look green while publishing nothing."
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::verify.outputs.tag is empty; the publish jobs cannot identify what to release."
            exit 1
          fi
          echo "Routing to $([ "${PRERELEASE}" = "true" ] && echo publish-prerelease || echo publish-stable) for ${TAG}."

      - name: Fail fast when the version is already published
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} is already published. Published versions are immutable; bump to a new version instead of re-tagging."
            exit 1
          fi
          echo "${PKG_NAME}@${PKG_VERSION} is not published yet."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check
        run: bun run release:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: CLI validation
        run: bun run validate:cli

      - name: Marketplace validation
        run: bun run validate:marketplace

      - name: Packed CLI validation
        run: bun run validate:packed

  publish-prerelease:
    needs: verify
    if: needs.verify.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          npm install -g npm@11.17.0
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish prerelease to npm
        run: |
          PKG_VERSION="${{ needs.verify.outputs.version }}"
          PRERELEASE_TAG="${PKG_VERSION#*-}"
          DIST_TAG="${PRERELEASE_TAG%%.*}"
          npm publish --access public --tag "${DIST_TAG}"

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## " && $0 ~ ver { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-body.md

      - name: Create prerelease GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: /tmp/release-body.md
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-stable:
    needs: verify
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          npm install -g npm@11.17.0
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish stable to npm latest
        run: npm publish --access public

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          awk -v ver="${VERSION}" '
            $0 ~ "^## " && $0 ~ ver { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-body.md

      - name: Create stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          body_path: /tmp/release-body.md
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag push must publish. Both publish jobs are gated on a `verify` output, so a mistake in
  # that output makes both of them skip — and a run whose jobs all skipped reports success.
  # This job exists to turn that silence into a failure: it asserts that exactly one publish
  # path actually ran. It is the reason a green publish run can be trusted to mean "shipped".
  #
  # A declined `stable-release` deployment also lands here as a failure. That is intended: the
  # deployment was declined, so nothing shipped, and the run should not read green.
  confirm-published:
    needs: [verify, publish-prerelease, publish-stable]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Assert exactly one publish path succeeded
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          PRERELEASE_RESULT: ${{ needs.publish-prerelease.result }}
          STABLE_RESULT: ${{ needs.publish-stable.result }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "prerelease=${PRERELEASE} publish-prerelease=${PRERELEASE_RESULT} publish-stable=${STABLE_RESULT}"

          if [ "${PRERELEASE}" = "true" ]; then
            EXPECTED="publish-prerelease"; ACTUAL="${PRERELEASE_RESULT}"; OTHER="${STABLE_RESULT}"
          else
            EXPECTED="publish-stable";     ACTUAL="${STABLE_RESULT}";     OTHER="${PRERELEASE_RESULT}"
          fi

          if [ "${ACTUAL}" != "success" ]; then
            echo "::error::${EXPECTED} did not succeed for ${VERSION} (result: ${ACTUAL:-none}). Nothing was published."
            exit 1
          fi
          if [ "${OTHER}" = "success" ]; then
            echo "::error::Both publish paths succeeded for ${VERSION}. Exactly one must run."
            exit 1
          fi
          echo "Published ${VERSION} via ${EXPECTED}."
