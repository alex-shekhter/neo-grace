name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI validation
        run: bun run validate:ci

      - name: Run local release consistency check
        run: bun run release:check

      - name: Checkout exact head for pre-pin behavior
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: prepin-behavior

      - name: Install exact-head dependencies
        working-directory: prepin-behavior
        run: bun install --frozen-lockfile

      - name: Stamp pre-pin behavior head
        working-directory: prepin-behavior
        run: git rev-parse HEAD > prepin-behavior-head.txt

      - name: Run pre-pin controls
        working-directory: prepin-behavior
        run: bun test --timeout=0 src/grace-generate.test.ts src/grace-cursor.test.ts -t b53d13d --reporter=junit --reporter-outfile=prepin-behavior-junit.xml

      - name: Require pre-pin behavior files
        if: always()
        working-directory: prepin-behavior
        run: test -f prepin-behavior-junit.xml && test -f prepin-behavior-head.txt

      - name: Upload pre-pin behavior JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepin-behavior-junit
          if-no-files-found: error
          path: |
            prepin-behavior/prepin-behavior-junit.xml
            prepin-behavior/prepin-behavior-head.txt

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows path, shell, scope, and Unicode adapter regressions
        run: bun run test src/artifact/paths.test.ts src/artifact/scope.test.ts src/artifact/assertions.test.ts src/lint/adapters/python.test.ts src/grace-cursor.test.ts src/artifact/grammar.test.ts

      - name: Run the platform-agnostic pin and Windows directory-pin regressions
        run: 'bun run test src/grace-generate.test.ts -t "AC-PIN-ACQUISITION: an ordinary mint|AC-PIN-ACQUISITION: a forced open failure|AC-PIN-RELEASE: releaseAcquiredCandidate|AC-PIN-RELEASE-NO-LEAK|AC-PIN-RELEASE-LIFETIME|AC-PIN-RELEASE-API: successful writeSpecNew closes its record|AC-PIN-RELEASE-API: a publish failure closes the pin exactly once|AC-WINDOWS-DIRECTORY-PIN"'

      - name: Run the implicit-supersede pin release regressions
        run: 'bun run test src/grace-supersede.test.ts -t "AC-SUPERSEDE-PIN-RELEASE: a successful implicit mint|AC-SUPERSEDE-PIN-RELEASE: a post-mint failure removal|AC-SUPERSEDE-PIN-RELEASE: a post-mint refusal/residue|AC-SUPERSEDE-PIN-RELEASE: a pre-publication mint failure"'

      - name: Run Windows CLI integration regressions
        run: bun run validate:cli

  dart-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the real Dart adapter regression
        run: bun run test src/lint/adapters/dart.test.ts
